<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | Recipe App</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="management-page">

<header class="compact-header">
  <h1>👩‍🍳 Добре дошъл отново!</h1>
  <p>Влез в профила си и открий любимите си рецепти.</p>
</header>

<main class="management-container login-container">

  <section class="form-section login-section">

    <div class="form-heading">
      <div class="management-icon">🔐</div>
      <h2>Вход в профила</h2>
      <p>Въведи потребителското си име и парола.</p>
    </div>

    <p th:if="${param.registered}" class="success">
      Регистрацията е успешна! Можеш да влезеш.
    </p>

    <p th:if="${error}" th:text="${error}" class="error"></p>

    <form th:action="@{/login}" method="post" class="styled-form">

      <div class="form-group">
        <label for="username">Потребителско име</label>
        <input type="text"
               id="username"
               name="username"
               placeholder="Въведи потребителско име"
               autocomplete="username"
               required>
      </div>

      <div class="form-group">
        <label for="password">Парола</label>
        <input type="password"
               id="password"
               name="password"
               placeholder="Въведи парола"
               autocomplete="current-password"
               required>
      </div>

      <div class="form-actions login-actions">
        <button type="submit" class="management-button">
          Вход
        </button>
      </div>

    </form>

    <div class="login-links">
      <p>Нямаш профил?
        <a th:href="@{/register}">Регистрирай се</a>
      </p>

      <a th:href="@{/}" class="management-link">← Обратно към началото</a>
    </div>

  </section>

</main>

<footer class="management-footer">
  <p>&copy; 2026 Recipe App</p>
</footer>

</body>
</html>
