<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добави категория | Recipe App</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="management-page">

<header class="compact-header">
    <h1>📁 Добави категория</h1>
    <p>Създай нова категория и организирай рецептите си!</p>
</header>

<main class="management-container">

    <nav class="management-nav">
        <a th:href="@{/}" class="management-link">← Начало</a>
        <a th:href="@{/categories}" class="management-link">
            Всички категории
        </a>
    </nav>

    <section class="form-section">
        <div class="form-heading">
            <div class="management-icon">✨</div>
            <h2>Информация за категорията</h2>
            <p>Попълни данните за новата категория.</p>
        </div>

        <form th:action="@{/categories/add}"
              th:object="${category}"
              method="post"
              class="styled-form">

            <div class="form-group">
                <label for="name">Име на категорията</label>
                <input type="text"
                       id="name"
                       th:field="*{name}"
                       placeholder="Например: Десерти">

                <p class="error"
                   th:if="${#fields.hasErrors('name')}"
                   th:errors="*{name}"></p>
            </div>

            <div class="form-group">
                <label for="description">Описание</label>
                <textarea id="description"
                          th:field="*{description}"
                          rows="4"
                          placeholder="Кратко описание на категорията..."></textarea>

                <p class="error"
                   th:if="${#fields.hasErrors('description')}"
                   th:errors="*{description}"></p>
            </div>

            <div class="form-actions">
                <button type="submit" class="management-button">
                    Запази категорията
                </button>

                <a th:href="@{/categories}"
                   class="cancel-button">
                    Отказ
                </a>
            </div>

        </form>
    </section>

</main>

<footer class="management-footer">
    <p>&copy; 2026 Recipe App</p>
</footer>

</body>
</html>
