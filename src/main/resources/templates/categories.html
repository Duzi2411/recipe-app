<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Категории</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header>
    <h1>Категории</h1>
    <p>Организирай рецептите си по категории!</p>
</header>

<main>
    <nav>
        <a th:href="@{/}">Начало</a>
        <a th:href="@{/categories/add}">Добави категория</a>
        <a th:href="@{/recipes}">Всички рецепти</a>
    </nav>

    <section>
        <h2>Всички категории</h2>

        <p th:if="${#lists.isEmpty(categories)}">
            Все още няма добавени категории.
        </p>

        <div th:each="category : ${categories}">
            <h3 th:text="${category.name}">Име на категория</h3>
            <p th:text="${category.description}">Описание</p>

            <a th:href="@{/categories/{id}/edit(id=${category.id})}">
                Редактирай
            </a>

            <form th:action="@{/categories/{id}/delete(id=${category.id})}"
                  method="post">
                <button type="submit">Изтрий</button>
            </form>

            <hr>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2026 Recipe App</p>
</footer>

</body>
</html>
