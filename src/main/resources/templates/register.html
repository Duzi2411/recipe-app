<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | Recipe App</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="management-page">

<header class="compact-header">
    <h1>🍓 Добре дошъл в Recipe App!</h1>
    <p>Създай профил и открий света на вкусните рецепти.</p>
</header>

<main class="management-container login-container">

    <section class="form-section login-section">

        <div class="form-heading">
            <div class="management-icon">👩‍🍳</div>
            <h2>Създай профил</h2>
            <p>Попълни данните, за да се присъединиш към нас.</p>
        </div>

        <p th:if="${error}" th:text="${error}" class="error"></p>

        <form th:action="@{/register}"
              th:object="${registerRequest}"
              method="post"
              class="styled-form">

            <div class="form-group">
                <label for="username">Потребителско име</label>
                <input type="text"
                       id="username"
                       th:field="*{username}"
                       placeholder="Избери потребителско име"
                       autocomplete="username">

                <p class="error"
                   th:if="${#fields.hasErrors('username')}"
                   th:errors="*{username}"></p>
            </div>

            <div class="form-group">
                <label for="email">Имейл</label>
                <input type="email"
                       id="email"
                       th:field="*{email}"
                       placeholder="Въведи своя имейл"
                       autocomplete="email">

                <p class="error"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}"></p>
            </div>

            <div class="form-group">
                <label for="password">Парола</label>
                <input type="password"
                       id="password"
                       th:field="*{password}"
                       placeholder="Създай парола"
                       autocomplete="new-password">

                <p class="error"
                   th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}"></p>
            </div>

            <div class="form-actions login-actions">
                <button type="submit" class="management-button">
                    Създай профил
                </button>
            </div>

        </form>

        <div class="login-links">
            <p>Вече имаш профил?
                <a th:href="@{/login}">Влез тук</a>
            </p>

            <a th:href="@{/}" class="management-link">
                ← Обратно към началото
            </a>
        </div>

    </section>

</main>

<footer class="management-footer">
    <p>&copy; 2026 Recipe App</p>
</footer>

</body>
</html>
