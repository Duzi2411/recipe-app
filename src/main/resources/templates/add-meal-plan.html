<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добави хранене | Recipe App</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="management-page">

<header class="compact-header">
    <h1>📅 Добави планирано хранене</h1>
    <p>Организирай менюто си и планирай следващото си вкусно ястие!</p>
</header>

<main class="management-container">

    <nav class="management-nav">
        <a th:href="@{/}" class="management-link">← Начало</a>
        <a th:href="@{/meal-plans}" class="management-link">Всички планирани хранения</a>
    </nav>

    <section class="form-section recipe-form-section">

        <div class="form-heading">
            <div class="management-icon">🍽️</div>
            <h2>Информация за храненето</h2>
            <p>Избери рецепта и дата за своето планирано хранене.</p>
        </div>

        <form th:action="@{/meal-plans/add}"
              th:object="${mealPlan}"
              method="post"
              class="styled-form">

            <div class="form-group">
                <label for="title">Име</label>
                <input type="text"
                       id="title"
                       th:field="*{title}"
                       placeholder="Например: Семейна вечеря">

                <p class="error"
                   th:if="${#fields.hasErrors('title')}"
                   th:errors="*{title}"></p>
            </div>

            <div class="form-group">
                <label for="plannedDate">Дата</label>
                <input type="date"
                       id="plannedDate"
                       th:field="*{plannedDate}">

                <p class="error"
                   th:if="${#fields.hasErrors('plannedDate')}"
                   th:errors="*{plannedDate}"></p>
            </div>

            <div class="form-group">
                <label for="notes">Бележки</label>
                <textarea id="notes"
                          th:field="*{notes}"
                          rows="3"
                          placeholder="Добави допълнителни бележки..."></textarea>

                <p class="error"
                   th:if="${#fields.hasErrors('notes')}"
                   th:errors="*{notes}"></p>
            </div>

            <div class="form-group">
                <label for="recipeId">Рецепта</label>
                <select id="recipeId" name="recipeId" required>
                    <option value="">Избери рецепта</option>

                    <option th:each="recipe : ${recipes}"
                            th:value="${recipe.id}"
                            th:text="${recipe.title}">
                    </option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="management-button">
                    Запази храненето
                </button>

                <a th:href="@{/meal-plans}" class="cancel-button">
                    Отказ
                </a>
            </div>

        </form>
    </section>

</main>

<footer class="management-footer">
    <p>&copy; 2026 Recipe App</p>
</footer>

</body>
</html>
